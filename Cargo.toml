[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/auth",
    "crates/plugin",
    "crates/plugin-macros",
    "crates/app",
    "crates/cli",
    "plugins/example-plugin",
    "plugins/example-memo-plugin",
    "plugins/auth",
    "apps/example-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dev-five-git/yeollin-cms"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sea-orm = { version = "^2.0.2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }

# OpenAPI
vespera = "^0.4.0"
vespertide = "^0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for dev proxy
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
hyper = "1"

# WebSocket for HMR proxy
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Utils
thiserror = "2"
anyhow = "1"
include_dir = "0.7"
regex = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
async-walkdir = "2"
fs_extra = "1.3"
chrono = { version = "0.4", features = ["serde"] }
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = "0.7"
dunce = "1"
tempfile = "3"

# Auth / JWT
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"
rand = "0.10"
sha2 = "0.11"

# Internal crates
yeollin-core = { path = "crates/core" }
yeollin-auth = { path = "crates/auth" }
yeollin-plugin = { path = "crates/plugin" }
yeollin-plugin-macros = { path = "crates/plugin-macros" }
