name: Pages Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_YEOLLIN_BASE_PATH: /yeollin-cms
      VITE_YEOLLIN_DEMO: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build interactive demo
        working-directory: apps/example-app
        run: cargo run -p yeollin-cli -- build --skip-backend

      - name: Place prefixed assets at the Pages artifact root
        run: |
          base_path="${VITE_YEOLLIN_BASE_PATH#/}"
          mv "apps/example-app/.yeollin/app/out/${base_path}/_next" \
            apps/example-app/.yeollin/app/out/_next
          rmdir "apps/example-app/.yeollin/app/out/${base_path}"
          test -d apps/example-app/.yeollin/app/out/_next/static/css
          test -d apps/example-app/.yeollin/app/out/_next/static/chunks

      - name: Disable Jekyll processing
        run: touch apps/example-app/.yeollin/app/out/.nojekyll

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/example-app/.yeollin/app/out

  deploy:
    name: Deploy demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
