[package]
name = "yeollin-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yeollin CMS Backend Application"

[[bin]]
name = "yeollin"
path = "src/main.rs"

[lib]
name = "yeollin"
path = "src/lib.rs"

[dependencies]
yeollin-core = { workspace = true }
yeollin-auth = { workspace = true }
yeollin-plugin = { workspace = true }
yeollin-plugin-macros = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
vespera = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Database
sea-orm = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP client for dev proxy
reqwest = { workspace = true }
hyper = { workspace = true }

# WebSocket for HMR proxy
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

# Utils
anyhow = { workspace = true }
include_dir = { workspace = true }
