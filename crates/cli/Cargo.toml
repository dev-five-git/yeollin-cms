[package]
name = "yeollin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Yeollin CMS - prebuild, dev, and build commands"

[[bin]]
name = "yeollin"
path = "src/main.rs"
# The framework library already owns the `yeollin` rustdoc path.  Keeping this
# command-line binary out of rustdoc avoids a non-deterministic output collision
# while preserving documentation checks for the public library and macros.
doc = false

[dependencies]
# CLI
clap = { workspace = true }

# Async
tokio = { workspace = true }

# File system
include_dir = { workspace = true }
async-walkdir = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utils
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dunce = { workspace = true }
rand = { workspace = true }
toml_edit = { workspace = true }

# Internal
yeollin-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
