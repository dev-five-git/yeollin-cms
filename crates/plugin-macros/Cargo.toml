[package]
name = "yeollin-plugin-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for Yeollin CMS plugins"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "parsing"] }
serde_json = { workspace = true }
yeollin-core = { workspace = true }
